[build-system]
requires = ["setuptools>=52.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regexsolver"
version = "1.1.0"
authors = [
    { name = "RegexSolver", email = "contact@regexsolver.com" }
]
description = "RegexSolver is a powerful toolkit for building, combining, and analyzing regular expressions."
keywords = [
    "Regular Expression",
    "regex",
    "regexp",
    "pattern",
    "intersection",
    "union",
    "concat",
    "difference",
    "equivalence",
    "subset",
    "nfa",
    "dfa",
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    "aiohttp >= 3.8.4",
    "aiohttp-retry >= 2.8.3",
    "python-dateutil >= 2.8.2",
    "pydantic >= 2.0.0",
    "typing-extensions >= 4.7.1",
]

classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = [
    "pytest >= 7.2.1",
    "pytest-cov >= 2.8.1",
    "pytest-asyncio >= 1.3.0",
    "tox >= 3.9.0",
    "flake8 >= 4.0.0",
    "mypy >= 1.5",
    "types-python-dateutil >= 2.8.19.14",
]

[project.urls]
Homepage = "https://regexsolver.com/"
Issues = "https://github.com/RegexSolver/regexsolver-python/issues"
Documentation = "https://docs.regexsolver.com/"
"Source Code" = "https://github.com/RegexSolver/regexsolver-python"

[tool.setuptools.packages.find]
include = ["regexsolver*"]

[tool.mypy]
exclude = ["regexsolver/_generated/"]

# Generated code is not linted or type checked; it is regenerated from
# ../m-lab/shared/openapi.yaml by ./generate-api.sh.
[[tool.mypy.overrides]]
module = "regexsolver._generated.*"
follow_imports = "silent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
